# Groessentest Ersatzfirmware: Netzwerk, HTTP, Telnet-Shell, Parameter, ADC, PWM, Watchdog
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_POSIX_API=n

# Netzwerk (IPv4, DHCP, TCP, Sockets) ueber den Zephyr-Stack
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_POLL_MAX=16
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="evcc"
CONFIG_ETH_DRIVER=y
CONFIG_NET_L2_ETHERNET=y

# HTTP-Server (REST-API-Grundlage)
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=3
CONFIG_HTTP_SERVER_MAX_STREAMS=3
CONFIG_JSON_LIBRARY=y

# Shell ueber Telnet (Nutzerwunsch), dazu Kern-/Netz-Kommandos
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_NET_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n

# Parameter in eigenem Flash-Bereich (Sektor 7) ueber ZMS
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_RUNTIME=y

# Peripherie der Ladelogik
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y
