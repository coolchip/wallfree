# Wallfree-Anwendung. Nur bauen; Flashen/Ausfuehren auf Hardware nicht freigegeben.
CONFIG_WALLFREE_EVSE=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=512
# kein CONFIG_REBOOT: Neustart nur geordnet ueber evse reboot (SOLL-RT-22), hw_reset()
CONFIG_REBOOT=n
CONFIG_WATCHDOG=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_ASSERT=y
# Pruefungen bleiben; bei Ausloesung nur "ASSERTION FAIL @ Datei:Zeile" ohne
# Ausdruck und Meldungstext (spart 18 KB Flash, docs/architektur.md Abschnitt 5)
CONFIG_ASSERT_NO_COND_INFO=y
CONFIG_ASSERT_NO_MSG_INFO=y

# Netzwerk (IPv4, DHCP, TCP) ueber den Zephyr-Stack (F25: DHCP an)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
# Adresse und DHCP setzt die Anwendung (netcfg.c, net_dhcp/net_ip ...)
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_POLL_MAX=16
# eventfd: Socket-Service und HTTP-Server je einer. Mit 1 (Default) startet
# der HTTP-Server nicht ("eventfd failed (-12)", gefunden im PC-Test;
# ohne NET_LOG nicht im Log sichtbar)
CONFIG_ZVFS_EVENTFD_MAX=2
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="wallfree"
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_NET_HOSTNAME_MAX_LEN=32
CONFIG_ETH_DRIVER=y
CONFIG_NET_L2_ETHERNET=y
# SOLL-RT-07: Netz-Threads unter Schutz- (0) und Automatenthread (2). Zephyr setzt sie sonst
# kooperativ (nicht unterbrechbar, ueber allen preemptiven Threads); auf dem Testgeraet liess
# HTTP-Dauerlast den Automatenthread > 50 ms warten -> supervision_limit. Mit dieser Option
# laufen auch HTTP-Server, net_mgmt und Ethernet-RX preemptiv (HTTP/net_mgmt niedrigste Prio).
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=5
CONFIG_NET_TC_TX_THREAD_BASE_PRIO=5
CONFIG_NET_TCP_WORKER_PRIO=5
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=5

# Shell ueber Telnet, offen (F20), spaeter entfernen bzw. Default aus
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_KERNEL_SHELL=y
CONFIG_NET_SHELL=y
# Telnet-Optionen (Echo, Zeichenmodus) verstehen: noetig fuer Historie und
# Zeilenbearbeitung, wenn der Client in den Zeichenmodus wechselt
CONFIG_SHELL_TELNET_SUPPORT_COMMAND=y

# Parameterspeicher in Sektor 7 (SOLL-NVM-01), Sektor 3 nur lesen
CONFIG_WALLFREE_NVM=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# HTTP-/WebSocket-API fuer evcc (Soll-Spezifikation 12.1), Digest-Anmeldung
CONFIG_WALLFREE_API=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_WEBSOCKET=y
# ein Kontext je WebSocket-Client (WS_MAX in http_api.c); Default 1 liess nur
# einen Client zu (gefunden im PC-Test)
CONFIG_WEBSOCKET_MAX_CONTEXTS=3
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=512
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=400
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
CONFIG_HTTP_SERVER_CAPTURE_HEADER_COUNT=1
CONFIG_HTTP_SERVER_CAPTURE_HEADER_BUFFER_SIZE=420
CONFIG_ENTROPY_GENERATOR=y

# MQTT-Client (Soll-Spezifikation 12.6, F30): 3.1.1 ueber TCP, ohne TLS
CONFIG_MQTT_LIB=y
CONFIG_MQTT_VERSION_3_1_1=y

# Energiezaehler, nur Anzeige (Soll-Spezifikation 12.5, F28); Modbus-Client
# nur auf der Steuerung (boards/ev_cc_ac1.conf), in der Simulation ein Modell
CONFIG_WALLFREE_METER=y
