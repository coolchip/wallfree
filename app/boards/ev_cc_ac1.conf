# Zaehlerbus auf UART4 (Soll-Spezifikation 12.5, F29): Modbus-Client von Zephyr
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT=y
CONFIG_MODBUS_FP_EXTENSIONS=n
# Eastron-Werkseinstellung 8N1 ist nach der Norm nicht zulaessig (SOLL-MTR-02)
CONFIG_MODBUS_NONCOMPLIANT_SERIAL_MODE=y
# Start ueber den Original-Bootloader: er laesst SysTick, USART2, RTC und NVIC-Freigaben
# eingeschaltet; ohne Ruecksetzen kam ein Fehler vor main (Testgeraet, 2026-10-24)
CONFIG_INIT_ARCH_HW_AT_BOOT=y
# SOLL-RT-07: Ethernet-RX preemptiv (Folge von NET_TC_THREAD_PREEMPTIVE) unter dem
# Automatenthread (2), ueber den Netz-Threads (5)
CONFIG_ETH_STM32_HAL_RX_THREAD_PRIO=4
# SNTP: Zeitserver per Name, asynchron ohne Heap (timesync.c)
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_NUM_CONCUR_QUERIES=1
