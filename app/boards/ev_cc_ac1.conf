# Zaehlerbus auf UART4 (Soll-Spezifikation 12.5, F29): Modbus-Client von Zephyr
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT=y
CONFIG_MODBUS_FP_EXTENSIONS=n
# Eastron-Werkseinstellung 8N1 ist nach der Norm nicht zulaessig (SOLL-MTR-02)
CONFIG_MODBUS_NONCOMPLIANT_SERIAL_MODE=y
