# SPDX-License-Identifier: Apache-2.0
# PC-Simulation (native_sim): Hardware durch Modell ersetzt (hw_sim.c),
# Netz ueber Host-Sockets (kein TAP, keine Root-Rechte), Flash-Simulator
# mit Datei (--flash=<datei>). Rein fuer Tests auf dem PC.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_WATCHDOG=n
CONFIG_ETH_DRIVER=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_DHCPV4=n
# Telnet nur hier: Testzugang ohne Anmeldung fuer das Hardwaremodell (Kommando sim) und die
# Tests, auf der Steuerung nicht vorhanden (SOLL-SH-19)
CONFIG_SHELL_BACKEND_TELNET=y
CONFIG_SHELL_TELNET_PORT=2323
CONFIG_SHELL_TELNET_SUPPORT_COMMAND=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_STACK_SIZE=2048
# Log auf die Konsole (stdout)
CONFIG_LOG_BACKEND_NATIVE_POSIX=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NET_LOG=y
# Logging wie auf der Steuerung (native_sim waehlt sonst den Sofortmodus)
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_IMMEDIATE=n
# Ruhende HTTP-Verbindungen werden hier nie getrennt (NSOS ohne shutdown, siehe
# docs/implementierung.md); ein Browser haelt bis zu 6. Mehr Plaetze als auf der
# Steuerung (4), damit evcc daneben erreichbar bleibt.
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_ZVFS_OPEN_MAX=24
